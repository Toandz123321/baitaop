<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Làm bài trắc nghiệm – 100 câu</title><style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f4f5f7;--bd:#d0d4da;--ac:#2563eb;--ok:#16a34a;--no:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--fg:#eceef1;--card:#22262b;--bd:#3a3f46;--ac:#60a5fa;--ok:#4ade80;--no:#f87171}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:760px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:8px 0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;border-bottom:1px solid var(--bd);z-index:5;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:15px}
button.s{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:12px 0}
.c b{display:block;margin-bottom:8px}
.o{display:block;padding:8px 10px;margin:5px 0;border:1px solid var(--bd);border-radius:8px;background:var(--bg);cursor:pointer}
.o.sel{border-color:var(--ac);outline:1px solid var(--ac)}
.o.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--bg))}
.o.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,var(--bg))}
.sec{margin-top:20px;font-weight:700;color:var(--ac)}
#res{font-size:18px;font-weight:700}
img{max-width:100%;height:auto;border-radius:6px;margin:4px 0 10px;background:#fff}.tag{font-size:12px;opacity:.7;margin-bottom:4px}</style></head><body><div class="w">

","Chỉ có cuộn làm việc và cuộn số.","Chỉ có cuộn làm việc."],"a":0,"s":"Động cơ điện"},{"q":"Nguyên tắc đảo chiều quay động cơ điện 1 pha là:","o":["Giữ nguyên hai đầu cuộn dây làm việc, đảo thứ tự hai đầu cuộn dây đề.","Giữ nguyên hai đầu cuộn dây đề, đồng thời đảo thứ tự hai đầu cuộn dây làm việc và cuộn dây đề","Đảo vị trí hai dây nguồn cấp cho động cơ","Đảo thứ tự hai đầu cuộn dây làm việc và giữ nguyên mối nối với cuộn dây đề"],"a":0,"s":"Động cơ điện"},{"q":"Trong mạch sao – tam giác, thời gian chuyển mạch được xác định bởi:","o":["Rơle thời gian","Công tắc hành trình","Rơle nhiệt","Nút nhấn"],"a":0,"s":"Động cơ điện"},{"q":"Công tắc hành trình được sử dụng để:","o":["Khống chế theo vị trí hoặc hành trình chuyển động","Điều chỉnh điện áp","Tăng tốc độ động cơ","Bảo vệ ngắn mạch"],"a":0,"s":"Động cơ điện"},{"q":"Dòng điện chỉnh định cho rơle nhiệt để bảo vệ động cơ không đồng bộ 3 pha thông thường trong khoảng nào?","o":["Iđc = (1,1-1,2) Iđm","Iđc = (1,4-1,5) Iđm","Iđc = (0,9-1,0) Iđm","Iđc = (1,3-1,4) Iđm"],"a":0,"s":"Động cơ điện"},{"q":"Bộ dây quấn động cơ không đồng bộ ba pha nối tam giác thì các cặp đầu dây được đấu với nhau như thế nào?","o":["AZ, BX, CY.","AX, BY, CZ.","AZ, BY, CX","AX, BZ, CY"],"a":0,"s":"Động cơ điện"},{"q":"Trên nhãn của động cơ không đồng bộ ba pha có ghi: Δ/Y – 220/380 V, khi động cơ đấu tam giác thì điện áp nguồn cấp phù hợp cho động cơ là:","o":["220 V","660 V","415 V","380 V"],"a":0,"s":"Động cơ điện"},{"q":"Một hệ thống bơm nước sinh hoạt sử dụng 2 động cơ hoạt động luân phiên nhằm tăng tuổi thọ và dự phòng khi có sự cố. Phương án điều khiển phù hợp nhất là:","o":["Sử dụng mạch điều khiển luân phiên hai động cơ bằng rơle kết hợp phao (hoặc cảm biến mực nước).","Cho hai động cơ hoạt động đồng thời liên tục.","Chỉ sử dụng một động cơ có công suất lớn hơn.","Đấu song song hai động cơ và khởi động cùng lúc."],"a":0,"s":"Động cơ điện"},{"q":"Sau khi đấu nối mạch đảo chiều quay động cơ 3 pha, chế độ quay thuận vẫn hoạt động bình thường nhưng khi nhấn nút quay nghịch thì CB tác động ngay. Nguyên nhân chủ yếu là:","o":["Đấu sai liên động hoặc đấu sai mạch động lực","Động cơ bị thiếu dầu bôi trơn","Điện áp nguồn thấp hơn định mức","Rơle nhiệt chỉnh dòng quá lớn"],"a":0,"s":"Động cơ điện"},{"q":"Ý nghĩa con số 1450 vòng/phút ghi trên nhãn động cơ không đồng bộ 3 pha là:","o":["Tốc độ rotor","Tốc độ từ trường quay","Tốc độ khi không tải","Tốc độ của stator"],"a":0,"s":"Động cơ điện"},{"q":"Trong máy nén khí, bộ phận nào sau đây có chức năng bảo vệ áp suất trong bình chứa khí không vượt quá giá trị định mức?","o":["Động cơ","Van xả","Áp kế","Van an toàn"],"a":3,"s":"Khí nén – Thủy lực"},{"q":"Cổng điều khiển của van khí nén được ký hiệu là?","o":["Chữ P hoặc số 1","Chữ X,Y hoặc số 12, 14","Chữ A,B hoặc số 2, 4","Chữ X,Y hoặc số 2, 4"],"a":1,"s":"Khí nén – Thủy lực"},{"q":"Phần tử nào có chức năng điều khiển hướng dòng khí?","o":["Van đảo chiều","Xilanh","Máy nén khí","Bộ lọc khí"],"a":0,"s":"Khí nén – Thủy lực"},{"q":"Ký hiệu như hình (van 5/2, tác động bằng điện từ có lò xo hồi về) là ký hiệu của van nào sau đây:","o":["Van điện từ 3/2 1 trạng thái","Van con lăn 3/2 1 trạng thái","Van điện từ áp lực 5/2 1 trạng thái","Van áp lực 5/2 2 trạng thái"],"a":2,"s":"Khí nén – Thủy lực","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAC6AUADASIAAhEBAxEB/8QAGwAAAgIDAQAAAAAAAAAAAAAAAAEGBwIEBQP/xABKEAABAwMCAwUEBQcICQUAAAABAAIDBAURBiESMUEHEyJRcRRhgZEyQoKhsRUWI0NScsEkM1NiY2SSsiUmNHSiwtHh8ERUc4Px/8QAGAEBAQEBAQAAAAAAAAAAAAAAAQACAwT/xAAgEQEBAAIDAQADAQEAAAAAAAAAAQIREiExQSJCUQNh/9oADAMBAAIRAxEAPwCVpIQva8wSTSUghCFIJJpIQQkhKNYrJJQYPexhw97W523OEBzDykYfQ5UI7S6mSJ1HCxxHEC44OMrgC0XhjA79KARkcLytY48hdT1a4CeD5H5KpKg3m3xNkllqY4yccRecLKnul7MQkhqp3M8w7OE8P4N6Wyj12VXN1FfY9jUSH1blerNX3mPYua71ai4VTLay8Jfeq8Zrm5M+nDG4+i9m6/qh9OjjP2ijjkdp6 o chiều (ví dụ như van 4/2, van 5/2, van 4/3...) được thể hiện bằng hai con số. Các con số này lần lượt có ý nghĩa là gì?","o":["Số đường ống dầu nén và số đường ống dầu xả hồi về bể.","Số vị trí định vị con trượt của van và số cửa để dẫn dầu vào/ra.","Số cửa (lỗ để dẫn dầu vào hay ra) và số vị trí (số định vị con trượt của van).","Số tín hiệu điều khiển điện từ và số lượng con trượt bên trong van."],"a":2,"s":"Khí nén – Thủy lực"},{"q":"Cho một lực 5.000N tác động lên một diện tích 0,01m². Áp suất tạo ra có giá trị là:","o":["5.000 N/m²","50.000 N/m²","5.000.000 N/m²","500.000 N/m²"],"a":3,"s":"Khí nén – Thủy lực"},{"q":"Áp suất ở câu trên đổi ra đơn vị bar có giá trị tương ứng là:","o":["5 bar","0,5 bar","50 bar","500 bar"],"a":0,"s":"Khí nén – Thủy lực"},{"q":"Một xilanh thủy lực tác động kép có diện tích bề mặt pít tông là A và diện tích bề mặt cần pít tông là a. Nếu áp suất hệ thống được duy trì là P, công thức nào sau đây được dùng để tính lực kéo lùi về pít tông?","o":["F = P x A","F = P x a","F = P x (A - a)","F = P / (A - a)"],"a":2,"s":"Khí nén – Thủy lực"},{"q":"Khi thiết kế một mạch thủy lực điều khiển xilanh nâng hạ trọng vật, muốn tốc độ đẩy ra của xilanh duỗi ra từ từ, nhưng tốc độ lùi về của xilanh phải nhanh và không bị hạn chế dòng chảy. Phần tử thủy lực nào sau đây là lựa chọn bắt buộc và phù hợp nhất để lắp đặt vào mạch?","o":["Van tiết lưu 2 chiều","Van tiết lưu một chiều.","Van an toàn.","Van giảm áp."],"a":1,"s":"Khí nén – Thủy lực"},{"q":"Cho mạch điện khí nén như hình (có PB1, PB2, S1, S2, rơle thời gian T, bộ đếm CT). Mạch hoạt động thế nào khi nhấn nút nhấn PB1 và sau đó nhấn PB2?","o":["Nhấn PB1, xilanh duỗi ra 5s sau thụt vào, lặp lại liên tục 5 chu kỳ rồi tự dừng. Nhấn PB2, mạch chạy lại.","Nhấn PB1, xilanh duỗi ra rồi đứng yên. Nhấn PB2, xilanh thụt về.","Nhấn PB1, xilanh duỗi ra rồi thụt vào liên tục. Nhấn PB2, mạch chạy lặp lại liên tục.","Nhấn PB1, xilanh duỗi ra thụt vào liên tục 5 chu kỳ trong 5 giây rồi tự dừng. Nhấn PB2, mạch chạy lại."],"a":0,"s":"Khí nén – Thủy lực","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAFwAiwDASIAAhEBAxEB/8QAGwABAQADAQEBAAAAAAAAAAAAAAECBAUDBgf/xABLEAACAgECAgQJBwkHAgYDAAAAAQIDBAUREiETMUFRBhQiYYGRobHBFTJScXKy0SMzNUJiY6KjwiQlU3OCg5I0kxZFZISz4UPS8P/EABgBAQEBAQEAAAAAAAAAAAAAAAABAgME/8QAIhEBAQEAAgICAgMBAAAAAAAAAAERIUECMQMSUXETYYGR/9oADAMBAAIRAxEAPwD7HYhnsQ97ysQUbAQF2IBAfMa7qdVerSn43CuWn1xs6J2KPSOT8pbdvkL1yPpoSjKMZxacZLdNdqIMgUhQABABSABsUAYlAAEKAIAAA7QABCkAEKQBsQWOUYScIqUkuUW9t39Z8zlZKycPG+Ua1jZlknCmU7UlBrm5p+bb08l2iD6ZkZ8zPJz56vlxl08I1VxnVDqhKMJvfbbr4kzr6VkvMpsyo2dJVbY+h5cuBcuX1vcMtucIT+fCMvrW54ywMWULIPGq4bFtYlWlxrz95tEDTyoprx6YVUwjCuC2jGK5JHOzdBxcnxrad1UcqLjdCmzhjN7bcTXf/wDzOrsAmuVPR1GWJPGyrarMWDrU5JTcq3tvF7/UufmMMXRIVYWdh5F076cu2ybTWzip9a37frOwQG1yfk7Jvrw6MydU4YlsZ9JFvitcU1Hdbcuvd831FxcbIq1zOyZ1xVF9dahJS3e8U9916fYdUdYViNigDFkKAIAABCkAjIykIMSMyIBgwUgAhSAYsF2IBCFIBCFIAIUbFEAAAx2MgBiQyIQfRMhTXzsyrBpVt6scXNQSrg5SbfUkkaHszGU4Q245KO7UVu9t2+w5cPCTS5VdLK+yuv6dlFkY93W47Hz+TqC1LwvxbJaji/JGHJyhtdGG9qj1tN+VzfWuXtJaSPtl1DY8a8vGtSdWTTYn9CxP3HsuZRpU6dj1xvU4Rsd1srJuyKe7fZ9SWy9Bnp2K8LDhjdI7I1bxg2ufDvyXoWy9BtAggKNho5UM6/5Wli29FGDbUK2mpuKW6kn1S37l1GzpmW87F6aVbqlxyi4N7uOza5mFmlwnmQyZX3OMLOkVPEuDj2236t+18t9j3w8aOLCyEZOSnbKfPs4nvsBsEKNhodoYAGJSS6nyfV2dZ8ljW4WNXk022PolCDlOm2UXN8TSU+rhm318+YH1xDW0yM44FEbLFZNQ2clLi9vb3bm0S+2UBSFaACAAUBKx7QUgUMLK4WLayEJrulFMzAHk4V8fNQ43Fpd+xKaasemNNEI11wW0YRWyS8xw83oqbMnpo76nKcpYslHypfQUX3Lqa+vc3IX6zCP5TBxLHtz6PJa98QOmDm+P5sPzuj5H+3bXL+pD5YjF7W6fqFW3a8dyX8LYHSMdjn/Lmnx26Wyyrf8AxaZw96OR4Q+Gun6VCpYrhm22Pdxrnsox72+/zEtz2klr6ghp6XqeLqmHXlYlsZV2LfbfnF9qa7zdKqELt3hoDEF2IwIydhSAQj6ygAQoAxIZEZBiyMoAxIykYEAAEMTIAYMFIBCFIBAUgAAFAhdgQTYmxkNgPodjleEU5V4uNOFcrJRy6doRaTl5W23Pl2nWZzNe8nEpn9HKpe/+5FfE0kcHOzHT4D3wVcnfbC6KqXOUfLlxP/St36Dt6O8PIwlTVTLbHarnC+raalspbtPte6e/bucTAqWX4 õ ra biến thiên liên tục."],"a":0,"s":"Điện tử công suất"},{"q":"Trong mạch chỉnh lưu tia ba pha có điều khiển dùng SCR, góc kích điều khiển α bắt đầu được tính toán từ thời điểm góc pha ωt bằng bao nhiêu?","o":["60°","90°","30°","120°"],"a":2,"s":"Điện tử công suất"},{"q":"Điểm khác biệt lớn nhất về khả năng dẫn dòng giữa TRIAC và SCR là gì?","o":["TRIAC có khả năng dẫn dòng điện theo cả hai chiều, còn SCR chỉ dẫn dòng điện theo một chiều từ Anode sang Cathode.","TRIAC chỉ dẫn được dòng điện một chiều công suất lớn, còn SCR chỉ dẫn được dòng điện xoay chiều công suất nhỏ.","TRIAC cần dòng điện kích liên tục để duy trì trạng thái dẫn, còn SCR chỉ cần một xung kích ngắn.","TRIAC chỉ dẫn dòng khi được cấp điện áp ngược, còn SCR chỉ dẫn dòng khi được cấp điện áp thuận."],"a":0,"s":"Điện tử công suất"},{"q":"Trong các mạch chỉnh lưu có điều khiển, khi thiết lập góc kích α = 0° thì dòng điện qua SCR tương đương với loại linh kiện bán dẫn nào?","o":["Transistor công suất (BJT).","Diode công suất.","MOSFET công suất.","TRIAC"],"a":1,"s":"Điện tử công suất"},{"q":"Về mặt cấu tạo tương đương, linh kiện TRIAC có thể được coi là sự kết hợp của các phần tử nào sau đây?","o":["Hai SCR mắc song song ngược chiều và có chung cực cổng điều khiển","Hai Diode công suất mắc nối tiếp ngược chiều nhau","Một SCR và một Diode ghép song song thuận chiều","Hai Transistor ghép theo kiểu đẩy kéo"],"a":0,"s":"Điện tử công suất"},{"q":"Trong mạch chỉnh lưu cầu 3 pha không điều khiển, đặc điểm phối hợp dẫn của các Diode là gì?","o":["Tất cả 6 Diode đều dẫn điện đồng thời để đảm bảo công suất ngõ ra là lớn nhất.","Ba Diode thuộc nhóm phía trên sẽ dẫn điện đồng thời trong suốt nửa bán kỳ dương.","Tại mỗi thời điểm có 2 Diode dẫn điện, một con thuộc nhóm Anode chung và một con thuộc nhóm Cathode chung.","Chỉ có duy nhất 1 Diode dẫn điện tại một thời điểm tùy theo điện áp pha cao nhất."],"a":2,"s":"Điện tử công suất"},{"q":"Khi SCR đang ở trạng thái dẫn dòng trong mạch điện một chiều (DC), nếu ta ngắt dòng điều khiển (IG = 0) thì hiện tượng gì sẽ xảy ra?","o":["SCR sẽ lập tức ngắt và ngưng dẫn điện hoàn toàn","SCR sẽ bị khóa lại và chỉ mở ra khi điện áp nguồn DC đổi chiều","SCR sẽ bị quá nhiệt và dẫn đến hư hỏng, chập mạch","SCR vẫn tiếp tục dẫn điện bình thường như trước khi ngắt dòng IG"],"a":3,"s":"Điện tử công suất"},{"q":"Trong mạch chỉnh lưu có điều khiển toàn kỳ cấp cho tải thuần trở, khi góc kích α tăng dần từ 0° lên 180° thì trị số điện áp chỉnh lưu trung bình trên tải sẽ thay đổi như thế nào?","o":["Giữ nguyên giá trị cũ không thay đổi","Giảm dần xuống bằng zero","Chỉ giảm đi một lượng rất ít không đáng kể","Tăng dần lên đến giá trị cực đại"],"a":1,"s":"Điện tử công suất"},{"q":"Cho mạch chỉnh lưu cầu một pha không điều khiển, tải thuần trở, với ui = 220√2 sin100πt (V). Điện áp trung bình trên tải Udc bằng bao nhiêu?","o":["198V","220V","140V","311V"],"a":0,"s":"Điện tử công suất"},{"q":"Cho mạch chỉnh lưu tia 2 pha, với ui = 24√2 sin100πt (V), R = 12Ω. Cho biết điện áp ngược cực đại (UNmax) đặt lên mỗi Diode là bao nhiêu?","o":["24√2","48V","48√2 (V)","24V"],"a":2,"s":"Điện tử công suất"},{"q":"Cho sơ đồ mạch chỉnh lưu cầu 3 pha như hình (D1, D3, D5 phía trên; D4, D6, D2 phía dưới), xét trong khoảng thời gian 3π/6 < t < 5π/6 thì cặp Diode nào thực hiện dẫn điện?","o":["D1 và D6","D3 và D2","D5 và D6","D1 và D2"],"a":3,"s":"Điện tử công suất","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAEeAagDASIAAhEBAxEB/8QAGwABAQEBAQEBAQAAAAAAAAAAAAEFBAIDBgf/xABGEAACAgECAgQMAwcCBQIHAAAAAQIDBAUREiExQVFxBhMVIjJSYXKRobHBFEKBI1NiY4KD0TOiFiQ1wuElRAc0Q1Rkc5P/xAAXAQEBAQEAAAAAAAAAAAAAAAAAAQIE/8QAGxEBAQEBAAMBAAAAAAAAAAAAABEBIQISQTH/2gAMAwEAAhEDEQA/AP2Gw2PQO9yvIPRAIQ9bDYDyCkAgKAIQuwRIMbV8am/VtNV9ULYS44uM47roPvLQNJm93gUp+xbfQ86v5uo6ZP8AnOPxRqCF1kS8HtNb82mcPctkvueZeD2K+cL8uHu3P7 function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let D=[],ans=[],done=false,y=0;
function build(){D=shuf(RAW).map(d=>{const idx=shuf(d.o.map((_,k)=>k));return{q:d.q,s:d.s,img:d.img,o:idx.map(k=>d.o[k]),a:idx.indexOf(d.a)};});ans=new Array(D.length).fill(-1);done=false;}
const list=document.getElementById("list");
function render(){list.innerHTML="";D.forEach((d,i)=>{
 const c=document.createElement("div");c.className="c";
 const g=document.createElement("div");g.className="tag";g.textContent=d.s;c.appendChild(g);
 const t=document.createElement("b");t.textContent="Câu "+(i+1)+": "+d.q;c.appendChild(t);
 if(d.img){const im=document.createElement("img");im.src=d.img;im.alt="Hình minh họa";c.appendChild(im);}
 d.o.forEach((o,j)=>{const l=document.createElement("label");l.className="o";
  if(done){if(j===d.a)l.classList.add("ok");else if(j===ans[i])l.classList.add("no");}else if(ans[i]===j)l.classList.add("sel");
  l.textContent=L[j]+". "+o;
  l.onclick=()=>{if(done)return;y=window.scrollY;ans[i]=j;render();window.scrollTo(0,y);};
  c.appendChild(l);});
 list.appendChild(c);});
 document.getElementById("prog").textContent="Đã làm "+ans.filter(x=>x>=0).length+"/"+D.length;}
document.getElementById("sb").onclick=()=>{const n=ans.filter(x=>x>=0).length;
 if(!done&&n<D.length&&!confirm("Còn "+(D.length-n)+" câu chưa làm. Vẫn nộp bài?"))return;
 done=true;const k=D.filter((d,i)=>ans[i]===d.a).length;
 document.getElementById("res").textContent="Điểm: "+k+"/100 ("+(k/10).toFixed(1)+"/10)";render();window.scrollTo(0,0);};
document.getElementById("rs").onclick=()=>{build();document.getElementById("res").textContent="";render();window.scrollTo(0,0);};
build();render();
</script></body></html>
